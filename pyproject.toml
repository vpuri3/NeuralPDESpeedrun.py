[project]
name = "neuralpdespeedrun"
version = "0.1.0"
description = "Data-free neural PDE solver speedrun"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.15",          # PyPI wheels: CUDA 13.2 (H100; NVIDIA driver >= 580)
    "numpy>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "scipy>=1.15.3",
    "array-api-compat>=1.16.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

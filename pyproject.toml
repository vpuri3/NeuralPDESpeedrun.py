[project]
name = "neuralpdespeedrun"
version = "0.1.0"
description = "Data-free neural PDE solver speedrun"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15",          # PyPI wheels: CUDA 13.2 (H100; NVIDIA driver >= 580)
    "numpy>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "scipy>=1.15.3",
    "array-api-compat>=1.16.0",
    "jax[cuda13]>=0.12",
    "flax>=0.12",
    "optax>=0.2.8",
    "soap-jax",
]

[tool.uv]
package = false

[tool.uv.sources]
soap-jax = { git = "https://github.com/haydn-jones/SOAP_JAX", rev = "a7c92f174c49b13136294a94ae0d46266b4f671f" }

[tool.ruff]
line-length = 120
